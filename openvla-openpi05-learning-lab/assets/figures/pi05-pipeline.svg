<text x="660" y="625" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#142126" text-anchor="middle">Paper objective: autoregressive semantic/FAST tokens + continuous flow loss, with target isolation.</text>
<text x="660" y="657" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#b94a48" text-anchor="middle">Public openpi π0.5 path: currently the flow-matching head for training/inference.</text>
<text x="660" y="682" font-family="DejaVu Sans" font-size="14" font-weight="600" fill="#52666e" text-anchor="middle">Prediction horizon H and execution horizon k are different variables.</text>
