<g><rect x="825" y="400" width="200" height="120" rx="14" fill="#ffffff" stroke="#1c7c7d" stroke-width="3"/><text x="925.0" y="434" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#1c7c7d" text-anchor="middle"><tspan x="925.0" dy="0">Execute k steps</tspan></text><text x="925.0" y="486" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="925.0" dy="0">k is runtime choice</tspan></text></g>
<g><rect x="550" y="400" width="205" height="120" rx="14" fill="#ffffff" stroke="#4e8d61" stroke-width="3"/><text x="652.5" y="434" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#4e8d61" text-anchor="middle"><tspan x="652.5" dy="0">Robot + controller</tspan></text><text x="652.5" y="486" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="652.5" dy="0">50 Hz target tracking</tspan></text></g>
<g><rect x="285" y="400" width="210" height="120" rx="14" fill="#ffffff" stroke="#3d6fb4" stroke-width="3"/><text x="390.0" y="434" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#3d6fb4" text-anchor="middle"><tspan x="390.0" dy="0">New observation</tspan></text><text x="390.0" y="486" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="390.0" dy="0">invalidate / replan</tspan></text></g>
