<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
<title id="title">Pi zero point five inference pipeline</title>
<desc id="desc">Original educational diagram created for this study guide.</desc>
<rect width="100%" height="100%" fill="#f7f3ea" rx="18"/>
