<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.16"/></filter>
</defs>
<text x="660" y="42" font-family="DejaVu Sans" font-size="24" font-weight="800" fill="#142126" text-anchor="middle">π0.5: SEMANTIC PREFIX + FLOW ACTION EXPERT + RECEDING-HORIZON EXECUTION</text>
<g><rect x="45" y="90" width="190" height="125" rx="14" fill="#ffffff" stroke="#3d6fb4" stroke-width="3"/><text x="140.0" y="124" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#3d6fb4" text-anchor="middle"><tspan x="140.0" dy="0">Multiple images</tspan><tspan x="140.0" dy="23">+ state + task</tspan></text><text x="140.0" y="161" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="140.0" dy="0">masked camera slots</tspan><tspan x="140.0" dy="19">state serialized</tspan></text></g>
<g><rect x="285" y="90" width="210" height="125" rx="14" fill="#ffffff" stroke="#7056a8" stroke-width="3"/><text x="390.0" y="124" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#7056a8" text-anchor="middle"><tspan x="390.0" dy="0">PaliGemma</tspan><tspan x="390.0" dy="23">semantic prefix</tspan></text><text x="390.0" y="181" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="390.0" dy="0">visual/language tokens</tspan></text></g>
<g><rect x="550" y="55" width="205" height="105" rx="14" fill="#ffffff" stroke="#1c7c7d" stroke-width="3"/><text x="652.5" y="89" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#1c7c7d" text-anchor="middle"><tspan x="652.5" dy="0">High-level pass</tspan></text><text x="652.5" y="126" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="652.5" dy="0">optional subtask text</tspan></text></g>
<g><rect x="550" y="195" width="205" height="105" rx="14" fill="#ffffff" stroke="#d0a43b" stroke-width="3"/><text x="652.5" y="229" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#d0a43b" text-anchor="middle"><tspan x="652.5" dy="0">Prefix KV cache</tspan></text><text x="652.5" y="266" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="652.5" dy="0">reused for sampling</tspan></text></g>
<g><rect x="825" y="55" width="200" height="105" rx="14" fill="#ffffff" stroke="#3d6fb4" stroke-width="3"/><text x="925.0" y="89" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#3d6fb4" text-anchor="middle"><tspan x="925.0" dy="0">Gaussian noise</tspan></text><text x="925.0" y="126" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="925.0" dy="0">[H, padded d]</tspan></text></g>
<g><rect x="825" y="195" width="200" height="105" rx="14" fill="#ffffff" stroke="#d7782f" stroke-width="3"/><text x="925.0" y="229" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#d7782f" text-anchor="middle"><tspan x="925.0" dy="0">300M action</tspan><tspan x="925.0" dy="23">expert</tspan></text><text x="925.0" y="266" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="925.0" dy="0">AdaRMS time conditioning</tspan></text></g>
