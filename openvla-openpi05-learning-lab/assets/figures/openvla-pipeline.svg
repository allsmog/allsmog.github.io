<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc">
<title id="title">OpenVLA inference pipeline</title>
<desc id="desc">Original educational diagram created for this study guide.</desc>
<rect width="100%" height="100%" fill="#f7f3ea" rx="18"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52666e"/></marker>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity="0.16"/></filter>
</defs>
<text x="660" y="42" font-family="DejaVu Sans" font-size="24" font-weight="800" fill="#142126" text-anchor="middle">OPENVLA: ONE IMAGE → ACTION TOKENS → ONE PHYSICAL ACTION</text>
<g><rect x="45" y="110" width="160" height="105" rx="14" fill="#ffffff" stroke="#3d6fb4" stroke-width="3"/><text x="125.0" y="144" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#3d6fb4" text-anchor="middle"><tspan x="125.0" dy="0">RGB</tspan><tspan x="125.0" dy="23">image</tspan></text><text x="125.0" y="181" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="125.0" dy="0">one current view</tspan></text></g>
<g><rect x="250" y="70" width="180" height="95" rx="14" fill="#ffffff" stroke="#7056a8" stroke-width="3"/><text x="340.0" y="104" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#7056a8" text-anchor="middle"><tspan x="340.0" dy="0">DINOv2</tspan></text><text x="340.0" y="131" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="340.0" dy="0">patch features</tspan></text></g>
<g><rect x="250" y="190" width="180" height="95" rx="14" fill="#ffffff" stroke="#1c7c7d" stroke-width="3"/><text x="340.0" y="224" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#1c7c7d" text-anchor="middle"><tspan x="340.0" dy="0">SigLIP</tspan></text><text x="340.0" y="251" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="340.0" dy="0">patch features</tspan></text></g>
<g><rect x="485" y="125" width="180" height="115" rx="14" fill="#ffffff" stroke="#d0a43b" stroke-width="3"/><text x="575.0" y="159" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#d0a43b" text-anchor="middle"><tspan x="575.0" dy="0">Channel concat</tspan><tspan x="575.0" dy="23">+ projector</tspan></text><text x="575.0" y="206" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="575.0" dy="0">[P, d_LM]</tspan></text></g>
<g><rect x="720" y="70" width="190" height="95" rx="14" fill="#ffffff" stroke="#3d6fb4" stroke-width="3"/><text x="815.0" y="104" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#3d6fb4" text-anchor="middle"><tspan x="815.0" dy="0">Prompt tokens</tspan></text><text x="815.0" y="131" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="815.0" dy="0">instruction</tspan></text></g>
<g><rect x="720" y="190" width="190" height="95" rx="14" fill="#ffffff" stroke="#7056a8" stroke-width="3"/><text x="815.0" y="224" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#7056a8" text-anchor="middle"><tspan x="815.0" dy="0">Image tokens</tspan></text><text x="815.0" y="251" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="815.0" dy="0">after BOS</tspan></text></g>
<g><rect x="965" y="125" width="190" height="115" rx="14" fill="#ffffff" stroke="#d7782f" stroke-width="3"/><text x="1060.0" y="159" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#d7782f" text-anchor="middle"><tspan x="1060.0" dy="0">Llama 2 7B</tspan></text><text x="1060.0" y="206" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="1060.0" dy="0">causal decoder</tspan></text></g>
<g><rect x="965" y="350" width="190" height="120" rx="14" fill="#ffffff" stroke="#b94a48" stroke-width="3"/><text x="1060.0" y="384" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#b94a48" text-anchor="middle"><tspan x="1060.0" dy="0">Action-token IDs</tspan></text><text x="1060.0" y="436" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="1060.0" dy="0">one per dimension</tspan></text></g>
<g><rect x="720" y="350" width="190" height="120" rx="14" fill="#ffffff" stroke="#d0a43b" stroke-width="3"/><text x="815.0" y="384" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#d0a43b" text-anchor="middle"><tspan x="815.0" dy="0">Bin centers</tspan><tspan x="815.0" dy="23">+ q01/q99</tspan></text><text x="815.0" y="436" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="815.0" dy="0">de-tokenize</tspan></text></g>
<g><rect x="485" y="350" width="180" height="120" rx="14" fill="#ffffff" stroke="#4e8d61" stroke-width="3"/><text x="575.0" y="384" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#4e8d61" text-anchor="middle"><tspan x="575.0" dy="0">Robot adapter</tspan></text><text x="575.0" y="436" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="575.0" dy="0">units / frames</tspan></text></g>
<g><rect x="250" y="350" width="180" height="120" rx="14" fill="#ffffff" stroke="#1c7c7d" stroke-width="3"/><text x="340.0" y="384" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#1c7c7d" text-anchor="middle"><tspan x="340.0" dy="0">Controller</tspan></text><text x="340.0" y="436" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="340.0" dy="0">execute one action</tspan></text></g>
<g><rect x="45" y="350" width="160" height="120" rx="14" fill="#ffffff" stroke="#3d6fb4" stroke-width="3"/><text x="125.0" y="384" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#3d6fb4" text-anchor="middle"><tspan x="125.0" dy="0">Next</tspan><tspan x="125.0" dy="23">observation</tspan></text><text x="125.0" y="436" font-family="DejaVu Sans" font-size="13" font-weight="400" fill="#52666e" text-anchor="middle"><tspan x="125.0" dy="0">replan</tspan></text></g>
<line x1="205" y1="162" x2="250" y2="117" stroke="#52666e" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="205" y1="162" x2="250" y2="237" stroke="#52666e" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="430" y1="117" x2="485" y2="165" stroke="#52666e" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="430" y1="237" x2="485" y2="200" stroke="#52666e" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="665" y1="168" x2="720" y2="237" stroke="#52666e" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="910" y1="117" x2="965" y2="165" stroke="#52666e" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="910" y1="237" x2="965" y2="200" stroke="#52666e" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1060" y1="240" x2="1060" y2="350" stroke="#52666e" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="965" y1="410" x2="910" y2="410" stroke="#52666e" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="720" y1="410" x2="665" y2="410" stroke="#52666e" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="485" y1="410" x2="430" y2="410" stroke="#52666e" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="250" y1="410" x2="205" y2="410" stroke="#52666e" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M125 350 C125 300 125 275 125 230" fill="none" stroke="#52666e" stroke-width="3" marker-end="url(#arrow)"/>
<text x="660" y="555" font-family="DejaVu Sans" font-size="17" font-weight="600" fill="#142126" text-anchor="middle">Training masks image/prompt labels and applies cross-entropy only to action-answer positions.</text>
<text x="660" y="592" font-family="DejaVu Sans" font-size="14" font-weight="500" fill="#52666e" text-anchor="middle">Conceptual shapes are symbolic; exact patch count and action dimension depend on configuration/dataset.</text>
<rect x="55" y="625" width="1210" height="52" rx="12" fill="#fff4e8" stroke="#d7782f" stroke-width="2"/>
<text x="660" y="658" font-family="DejaVu Sans" font-size="15" font-weight="700" fill="#d7782f" text-anchor="middle">Main bottleneck: each control tick pays VLM autoregressive generation latency, but receives fresh visual feedback next tick.</text>
</svg>
